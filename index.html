<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Horní navigační panel s odkazy -->
    <header>
        <nav class="nav-links">
            <a href="image.html">Image Search</a>
            <a href="advanced.html">Advanced Search</a>
        </nav>
    </header>

    <!-- Hlavní obsah stránky přesně uprostřed -->
    <main class="main-container">
        <!-- Logo Google -->
        <div class="logo">
            <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
        </div>

        <!-- Formulář pro vyhledávání -->
        <form action="https://www.google.com/search" method="GET">
            <div class="search-bar-container">
                <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
                <input type="text" name="q" class="search-input" autofocus>
            </div>

            <!-- Tlačítka pod vyhledávacím polem -->
            <div class="buttons-container">
                <input type="submit" value="Google Search" class="search-btn">
                <input type="submit" name="btnI" value="I'm Feeling Lucky" class="search-btn lucky-btn">
            </div>
        </form>
    </main>

    <!-- Prázdný footer pro zachování vyváženého rozvržení -->
    <footer></footer>
</body>
</html>
