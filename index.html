<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="center-page">
    <!-- Horní navigace s odkazy na ostatní stránky a portfolio -->
    <header class="top-nav">
        <a href="images.html">Obrázky</a>
        <a href="advanced.html">Pokročilé hledání</a>
        <a href="forms.html">Ukázka formulářů</a>
        <a href="https://krystofsentensky.github.io/Portfolio/" target="_blank" rel="noopener">Moje Portfolio</a>
    </header>

    <!-- Hlavní vyhledávací sekce vycentrovaná na střed -->
    <main class="search-container">
        <h1 class="logo">Google</h1>
        
        <!-- Formulář odesílá data metodou GET na server Google -->
        <!-- Parametr 'action' určuje cílovou URL vyhledávání -->
        <form action="https://www.google.com/search" method="get" class="search-form">
            <div class="search-bar-wrapper">
                <!-- Parametr 'name="q"' představuje text dotazu (q = query), který Google vyžaduje -->
                <input type="text" name="q" class="search-bar" required aria-label="Vyhledat">
            </div>
            <div class="button-group">
                <!-- Standardní odesílací tlačítko -->
                <input type="submit" value="Hledat Googlem" class="btn">
                
                <!-- Tlačítko 'btnI' (I'm Feeling Lucky) přesměruje uživatele přímo na 1. výsledek hledání -->
                <input type="submit" name="btnI" value="Zkusím štěstí" class="btn">
            </div>
        </form>
    </main>

    <!-- Zápatí s povinnými odkazy na validátory, citace a portfolio -->
    <footer class="site-footer">
        <a href="https://validator.w3.org/check?uri=referer" target="_blank" rel="noopener">HTML Validátor</a>
        <a href="https://jigsaw.w3.org/css-validator/check/referer" target="_blank" rel="noopener">CSS Validátor</a>
        <a href="https://github.com/krystofsentensky/googlesearch/blob/main/citace.md" target="_blank" rel="noopener">Citace a zdroje</a>
        <a href="https://krystofsentensky.github.io/Portfolio/" target="_blank" rel="noopener">Moje Portfolio</a>
    </footer>
</body>
</html>
